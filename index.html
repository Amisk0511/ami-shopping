<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ami Shopping</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#123c78;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ffd43b}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold}
.login-btn,.cart-btn{background:#ffd43b;color:#123c78}
.hero{padding:35px 5%;background:linear-gradient(120deg,#123c78,#2875c7);color:white}
.hero h1{margin:0 0 10px;font-size:30px}
main{padding:25px 5%}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select{padding:12px;border:1px solid #ccd4df;border-radius:8px;font-size:15px}
#search{flex:1;min-width:180px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:white;border-radius:12px;padding:13px;box-shadow:0 3px 12px #0000000c}
.card img{width:100%;height:155px;object-fit:contain;background:#f5f6f8;border-radius:8px}
.card h3{margin:12px 0 6px}
.price{font-size:19px;font-weight:bold;color:#123c78}
.stock{font-size:13px;color:#64748b}
.add{background:#123c78;color:white;width:100%;margin-top:10px}
.add:disabled{background:#999;cursor:not-allowed}
.panel{background:white;border-radius:12px;padding:18px;margin:20px 0;box-shadow:0 3px 12px #0000000c}
.hidden{display:none}
#message{padding:12px;border-radius:8px;margin:12px 0}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.cart-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0;align-items:center}
.cart-row button{padding:6px 10px;background:#eee}
.primary{background:#123c78;color:white}
footer{text-align:center;padding:25px;background:#123c78;color:white;margin-top:35px}
@media(max-width:550px){header{padding:15px}.hero h1{font-size:24px}main{padding:18px 4%}}
</style>
</head>
<body><header>
 <div class="logo">Ami<span>.</span> Shopping</div>
 <div>
  <button class="login-btn" id="accountBtn" onclick="showAccount()">Login / Register</button>
  <button class="cart-btn" onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
 </div>
</header><section class="hero">
 <h1>Welcome to Ami Shopping</h1>
 <p>Shop your favourite products at great prices.</p>
 <strong>Islandwide Shopping – Sri Lanka 🇱🇰</strong>
</section><main>
 <div id="message" class="hidden"></div> <section id="accountPanel" class="panel hidden">
  <h2>Customer Account</h2>
  <div id="registerFields">
   <input id="fullName" placeholder="Full name">
   <input id="phone" placeholder="Phone number">
   <input id="address" placeholder="Delivery address">
  </div>
  <p><input id="email" type="email" placeholder="Email address" style="width:100%"></p>
  <p><input id="password" type="password" placeholder="Password" style="width:100%"></p>
  <button class="primary" onclick="login()">Login</button>
  <button class="login-btn" onclick="register()">Register</button>
  <button onclick="logout()">Logout</button>
  <p id="accountInfo"></p>
 </section> <section class="controls">
  <input id="search" placeholder="Search products..." oninput="renderProducts()">
  <select id="category" onchange="renderProducts()">
   <option value="">All Categories</option>
  </select>
 </section> <h2>Our Products</h2>
 <div id="products" class="products">Loading products...</div> <section id="cartPanel" class="panel hidden">
  <h2>Shopping Cart</h2>
  <div id="cartItems"></div>
  <h3>Total: <span id="cartTotal">Rs. 0.00</span></h3>
  <button class="primary" onclick="checkout()">Place Order</button>
 </section>
</main><footer>© 2026 Ami Shopping | Sri Lanka</footer><script>
let products=[];
let cart=[];
let currentUser=null;

function money(value){
 return 'Rs. '+Number(value||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function message(text,type='success'){
 const box=document.getElementById('message');
 box.textContent=text;
 box.className=type;
 window.scrollTo({top:0,behavior:'smooth'});
}
function showAccount(){
 document.getElementById('accountPanel').classList.toggle('hidden');
}
function showCart(){
 document.getElementById('cartPanel').classList.toggle('hidden');
 renderCart();
}
async function checkUser(){
 const {data,error}=await supabaseClient.auth.getUser();
 currentUser=data?.user||null;
 updateAccount();
}
function updateAccount(){
 const btn=document.getElementById('accountBtn');
 btn.textContent=currentUser?'My Account':'Login / Register';
 document.getElementById('accountInfo').textContent=currentUser?'Logged in: '+currentUser.email:'Please login to place an order.';
}
async function register(){
 const name=document.getElementById('fullName').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const address=document.getElementById('address').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!name||!phone||!address||!email||!password){message('Please fill all registration fields.','error');return;}
 const {data,error}=await supabaseClient.auth.signUp({
  email,password,
  options:{data:{full_name:name,phone,address}}
 });
 if(error){message(error.message,'error');return;}
 if(data.user && data.session){
  currentUser=data.user;
  updateAccount();
  message('Registration successful. You are logged in.');
 }else{
  message('Registration successful. Please verify your email, then login.');
 }
}
async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){message(error.message,'error');return;}
 currentUser=data.user;
 updateAccount();
 message('Login successful.');
}
async function logout(){
 const {error}=await supabaseClient.auth.signOut();
 if(error){message(error.message,'error');return;}
 currentUser=null;cart=[];
 updateAccount();renderCart();
 message('Logged out successfully.');
}
async function loadProducts(){
 const {data,error}=await supabaseClient.from('products')
  .select('id,name,category,price,stock,image_url,description,active')
  .eq('active',true).order('name');
 if(error){document.getElementById('products').textContent='Product loading error: '+error.message;return;}
 products=data||[];
 const categories=[...new Set(products.map(p=>p.category).filter(Boolean))];
 document.getElementById('category').innerHTML='<option value="">All Categories</option>'+
  categories.map(c=>'<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');
 renderProducts();
}
function escapeHtml(value){
 return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderProducts(){
 const search=document.getElementById('search').value.toLowerCase();
 const category=document.getElementById('category').value;
 const filtered=products.filter(p=>
  (String(p.name||'').toLowerCase().includes(search))&&
  (!category||p.category===category)
 );
 document.getElementById('products').innerHTML=filtered.length?filtered.map(p=>`
  <div class="card">
   <img src="${escapeHtml(p.image_url||'https://placehold.co/300x200?text=Ami+Shopping')}" alt="${escapeHtml(p.name)}">
   <h3>${escapeHtml(p.name||'Product')}</h3>
   <p>${escapeHtml(p.description||'')}</p>
   <div class="price">${money(p.price)}</div>
   <p class="stock">${Number(p.stock)>0?'Stock: '+Number(p.stock):'Out of stock'}</p>
   <button class="add" ${Number(p.stock)<=0?'disabled':''} onclick="addToCart(${Number(p.id)})">Add to Cart</button>
  </div>`).join(''):'<p>No products found.</p>';
}
function addToCart(id){
 const p=products.find(x=>Number(x.id)===id);
 if(!p||Number(p.stock)<=0)return;
 const item=cart.find(x=>x.id===id);
 if(item){
  if(item.quantity>=Number(p.stock)){message('Only '+p.stock+' available.','error');return;}
  item.quantity++;
 }else cart.push({id,name:p.name,price:Number(p.price),quantity:1});
 renderCart();
 message('Added to cart.');
}
function renderCart(){
 document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.quantity,0);
 document.getElementById('cartItems').innerHTML=cart.length?cart.map(x=>`
 <div class="cart-row">
  <span>${escapeHtml(x.name)} × ${x.quantity}<br>${money(x.price*x.quantity)}</span>
  <span><button onclick="changeQty(${x.id},-1)">−</button>
  <button onclick="changeQty(${x.id},1)">+</button>
  <button onclick="removeItem(${x.id})">Remove</button></span>
 </div>`).join(''):'Your cart is empty.';
 document.getElementById('cartTotal').textContent=money(cart.reduce((s,x)=>s+x.price*x.quantity,0));
}
function changeQty(id,change){
 const item=cart.find(x=>x.id===id);
 const p=products.find(x=>Number(x.id)===id);
 if(!item||!p)return;
 if(change>0&&item.quantity>=Number(p.stock)){message('Stock limit reached.','error');return;}
 item.quantity+=change;
 if(item.quantity<=0)removeItem(id);
 renderCart();
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);renderCart();}
async function checkout(){
 if(!currentUser){
  message('Please login before placing an order.','error');
  showAccount();return;
 }
 if(!cart.length){message('Your cart is empty.','error');return;}
 const {data:userData,error:userError}=await supabaseClient.auth.getUser();
 if(userError||!userData.user){currentUser=null;updateAccount();message('Please login again.','error');return;}
 const meta=userData.user.user_metadata||{};
 const name=meta.full_name||prompt('Enter your full name:');
 const phone=meta.phone||prompt('Enter your phone number:');
 const address=meta.address||prompt('Enter delivery address:');
 if(!name||!phone||!address){message('Customer details are required.','error');return;}
 const items=cart.map(x=>({
  name:x.name,product_id:String(x.id),quantity:x.quantity,unit_price:x.price
 }));
 const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);
 const {data,error}=await supabaseClient.rpc('place_order_with_stock',{
  p_customer_name:name,
  p_customer_phone:phone,
  p_delivery_address:address,
  p_total_amount:total,
  p_payment_method:'COD',
  p_items:items
 });
 if(error){message(error.message,'error');return;}
 cart=[];
 await loadProducts();
 renderCart();
 message('Order placed successfully! Order ID: '+data);
}
supabaseClient.auth.onAuthStateChange((_event,session)=>{
 currentUser=session?.user||null;
 updateAccount();
});
checkUser();
loadProducts();
renderCart();
</script></body>
</html>
