<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ami Shopping</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f8ff;
 color:#222;
}
header{
 background:#102f75;
 color:white;
 padding:20px;
 text-align:center;
}
nav{
 background:#168bd0;
 padding:15px;
 display:flex;
 justify-content:center;
 gap:20px;
}
nav a{
 color:white;
 text-decoration:none;
 font-weight:bold;
}
.search{
 text-align:center;
 padding:20px;
}
.search input{
 width:90%;
 max-width:500px;
 padding:14px;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:16px;
}
h2{
 text-align:center;
 color:#102f75;
}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:15px;
 padding:15px;
}
.card{
 background:white;
 padding:15px;
 text-align:center;
 border-radius:12px;
 box-shadow:0 2px 8px #ddd;
}
.emoji{font-size:45px}
.price{
 color:#102f75;
 font-weight:bold;
}
button{
 background:#ffd43b;
 border:0;
 padding:11px 15px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}
#cart{
 background:white;
 margin:15px;
 padding:20px;
 border-radius:12px;
}
.cart-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 border-bottom:1px solid #ddd;
 padding:12px 0;
}
.cart-item button{
 padding:6px 10px;
}
.total{
 font-size:20px;
 color:#102f75;
 font-weight:bold;
 text-align:right;
}
footer{
 background:#102f75;
 color:white;
 text-align:center;
 padding:20px;
 margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>🛒 Ami Shopping</h1>
<p>Your Online Grocery Marketplace</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart 🛒 (<span id="cartCount">0</span>)</a>
</nav>

<div class="search">
<input type="text" id="searchInput"
placeholder="Search products..."
oninput="searchProducts()">
</div>

<h2>Our Products</h2>

<section class="products" id="products"></section>

<h2>🛒 My Shopping Cart</h2>

<section id="cart">
<div id="cartItems">Your cart is empty.</div>
<p class="total">Total: Rs. <span id="total">0.00</span></p>
<button onclick="checkout()">Proceed to Checkout</button>
</section>

<footer>
<h3>Ami Shopping</h3>
<p>Online Grocery Marketplace</p>
<p>Cash on Delivery Available</p>
<p>© 2026 Ami Shopping</p>
</footer>

<script>

const products = [
{id:1,name:"Carrot",category:"Vegetables",price:350,emoji:"🥕"},
{id:2,name:"Potato",category:"Vegetables",price:280,emoji:"🥔"},
{id:3,name:"Tomato",category:"Vegetables",price:300,emoji:"🍅"},
{id:4,name:"Apple",category:"Fruits",price:900,emoji:"🍎"},
{id:5,name:"Banana",category:"Fruits",price:250,emoji:"🍌"},
{id:6,name:"Rice",category:"Groceries",price:220,emoji:"🍚"},
{id:7,name:"Milk",category:"Milk Products",price:450,emoji:"🥛"},
{id:8,name:"Juice",category:"Beverages",price:350,emoji:"🧃"}
];

let cart = [];

function displayProducts(list){
 const area=document.getElementById("products");
 area.innerHTML="";

 list.forEach(p=>{
 area.innerHTML+=`
 <div class="card">
 <div class="emoji">${p.emoji}</div>
 <h3>${p.name}</h3>
 <p>${p.category}</p>
 <p class="price">Rs. ${p.price.toFixed(2)}</p>
 <button onclick="addToCart(${p.id})">
 Add to Cart
 </button>
 </div>`;
 });
}

function searchProducts(){
 const text=document.getElementById("searchInput").value.toLowerCase();
 const filtered=products.filter(p=>
 p.name.toLowerCase().includes(text) ||
 p.category.toLowerCase().includes(text)
 );
 displayProducts(filtered);
}

function addToCart(id){
 const item=cart.find(p=>p.id===id);

 if(item){
 item.qty++;
 }else{
 const product=products.find(p=>p.id===id);
 cart.push({...product,qty:1});
 }

 updateCart();
}

function changeQty(id,amount){
 const item=cart.find(p=>p.id===id);
 if(!item)return;

 item.qty+=amount;

 if(item.qty<=0){
 cart=cart.filter(p=>p.id!==id);
 }

 updateCart();
}

function updateCart(){
 const area=document.getElementById("cartItems");
 let total=0;
 let count=0;

 if(cart.length===0){
 area.innerHTML="Your cart is empty.";
 }else{
 area.innerHTML="";

 cart.forEach(p=>{
 total+=p.price*p.qty;
 count+=p.qty;

 area.innerHTML+=`
 <div class="cart-item">
 <div>${p.emoji} ${p.name}<br>
 Rs. ${p.price} × ${p.qty}</div>
 <div>
 <button onclick="changeQty(${p.id},-1)">−</button>
 <button onclick="changeQty(${p.id},1)">+</button>
 </div>
 </div>`;
 });
 }

 document.getElementById("total").textContent=total.toFixed(2);
 document.getElementById("cartCount").textContent=count;
}

function checkout(){
 if(cart.length===0){
 alert("Your cart is empty!");
 return;
 }

 alert("Shopping cart is ready! Customer checkout will be added next.");
}

displayProducts(products);
updateCart();

</script>

</body>
</html>
