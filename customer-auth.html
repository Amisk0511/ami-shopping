<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Ami Shopping - Customer Account</title>  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script defer src="./supabase.js"></script>  <style>  
*{box-sizing:border-box}  
body{  
 margin:0;  
 font-family:Arial,sans-serif;  
 background:linear-gradient(135deg,#06358d,#0878ed);  
 min-height:100vh;  
 display:flex;  
 align-items:center;  
 justify-content:center;  
 padding:20px;  
}  
.box{  
 background:white;  
 width:100%;  
 max-width:430px;  
 padding:30px;  
 border-radius:20px;  
 box-shadow:0 10px 35px #001b5040;  
}  
.logo{  
 text-align:center;  
 font-size:35px;  
 font-weight:900;  
 color:#063b9c;  
}  
.logo span{color:#ffc900}  
h2{text-align:center;color:#14285b}  
input{  
 width:100%;  
 padding:14px;  
 margin:8px 0;  
 border:1px solid #d5deed;  
 border-radius:9px;  
 font-size:15px;  
}  
button{  
 width:100%;  
 padding:14px;  
 border:0;  
 border-radius:9px;  
 background:#0865e8;  
 color:white;  
 font-size:16px;  
 font-weight:bold;  
 cursor:pointer;  
 margin-top:12px;  
}  
.switch{  
 text-align:center;  
 margin-top:20px;  
 color:#596783;  
}  
.switch a{  
 color:#0865e8;  
 font-weight:bold;  
 cursor:pointer;  
}  
#error{  
 color:#d32f2f;  
 text-align:center;  
 font-size:14px;  
}  
#success{  
 color:#13853c;  
 text-align:center;  
 font-size:14px;  
}  
.hidden{display:none}  
</style>  </head>  <body>  <div class="box">   <div class="logo">Ami<span>🛒</span></div>   <div id="registerBox">  
  <h2>Create Account</h2>    <input id="fullName" type="text" placeholder="Full Name">  
  <input id="phone" type="tel" placeholder="Phone Number">  
  <input id="address" type="text" placeholder="Delivery Address">  
  <input id="regEmail" type="email" placeholder="Email Address">  
  <input id="regPassword" type="password" placeholder="Password (minimum 6 characters)">  
  <input id="confirmPassword" type="password" placeholder="Confirm Password">  <button id="registerBtn" type="button">Create Account</button>

  <p class="switch">  
   Already have an account?  
   <a onclick="showLogin()">Login</a>  
  </p>  
 </div>   <div id="loginBox" class="hidden">  
  <h2>Customer Login</h2>    <input id="loginEmail" type="email" placeholder="Email Address">  
  <input id="loginPassword" type="password" placeholder="Password">  <button id="loginBtn" type="button">Login</button>

  <p class="switch">  
   New customer?  
   <a onclick="showRegister()">Create Account</a>  
  </p>  
 </div>   <p id="error"></p>  
 <p id="success"></p>  </div>  <script>  
const $ = id => document.getElementById(id);  
  
function showLogin(){  
 $("registerBox").classList.add("hidden");  
 $("loginBox").classList.remove("hidden");  
 $("error").textContent="";  
 $("success").textContent="";  
}  
  
function showRegister(){  
 $("loginBox").classList.add("hidden");  
 $("registerBox").classList.remove("hidden");  
 $("error").textContent="";  
 $("success").textContent="";  
}  
  
function getClient(){  
 if(typeof supabaseClient === "undefined"){  
  throw new Error("Supabase connection not found. Check supabase.js");  
 }  
 return supabaseClient;  
}  
  
async function saveProfile(user, fullName, phone, address){  
 const db = getClient();  
  
 const profile = {  
  id:user.id,  
  full_name:fullName || user.user_metadata?.full_name || "",  
  phone:phone || user.user_metadata?.phone || "",  
  address:address || user.user_metadata?.address || ""  
 };  
  
 const {data,error} = await db  
  .from("customer_profiles")  
  .select("id")  
  .eq("id",user.id)  
  .maybeSingle();  
  
 if(error) throw error;  
  
 if(data){  
  const {error:updateError} = await db  
   .from("customer_profiles")  
   .update(profile)  
   .eq("id",user.id);  
  
  if(updateError) throw updateError;  
 }else{  
  const {error:insertError} = await db  
   .from("customer_profiles")  
   .insert(profile);  
  
  if(insertError) throw insertError;  
 }  
}  
  
async function register(){  
 $("error").textContent="";  
 $("success").textContent="";  
  
 try{  
  const name=$("fullName").value.trim();  
  const phone=$("phone").value.trim();  
  const address=$("address").value.trim();  
  const email=$("regEmail").value.trim();  
  const password=$("regPassword").value;  
  const confirm=$("confirmPassword").value;  
  
  if(!name || !phone || !address || !email || !password){  
   throw new Error("Please fill all fields.");  
  }  
  
  if(password.length<6){  
   throw new Error("Password must have at least 6 characters.");  
  }  
  
  if(password!==confirm){  
   throw new Error("Passwords do not match.");  
  }  
  
  $("registerBtn").disabled=true;  
  $("registerBtn").textContent="Creating Account...";  
  
  const db=getClient();  
  
  const {data,error}=await db.auth.signUp({  
   email,  
   password,  
   options:{  
    data:{  
     full_name:name,  
     phone:phone,  
     address:address  
    }  
   }  
  });  
  
  if(error) throw error;  
  
  if(data.session && data.user){  
   await saveProfile(data.user,name,phone,address);  
   $("success").textContent="Account created successfully!";  
   setTimeout(()=>{  
    window.location.href="./customer-dashboard.html";  
   },1000);  
  }else{  
   $("success").textContent=  
    "Registration successful! Please confirm your email, then login.";  
   showLogin();  
   $("success").textContent=  
    "Please check your email for confirmation, then login.";  
  }  
  
 }catch(e){  
  $("error").textContent=e.message;  
 }finally{  
  $("registerBtn").disabled=false;  
  $("registerBtn").textContent="Create Account";  
 }  
}  
  
async function login(){  
 $("error").textContent="";  
 $("success").textContent="";  
  
 try{  
  const email=$("loginEmail").value.trim();  
  const password=$("loginPassword").value;  
  
  if(!email || !password){  
   throw new Error("Enter email and password.");  
  }  
  
  $("loginBtn").disabled=true;  
  $("loginBtn").textContent="Logging in...";  
  
  const db=getClient();  
  
  const {data,error}=await db.auth.signInWithPassword({  
   email,  
   password  
  });  
  
  if(error) throw error;  
  
  await saveProfile(data.user);  
  
  $("success").textContent="Login successful!";  
  
  setTimeout(()=>{  
   window.location.href="./customer-dashboard.html";  
  },800);  
  
 }catch(e){  
  $("error").textContent=e.message;  
 }finally{  
  $("loginBtn").disabled=false;  
  $("loginBtn").textContent="Login";  
 }  
}  
  
$("registerBtn").addEventListener("click",register);  
$("loginBtn").addEventListener("click",login);  
</script>  </body>  
</html>
