<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ami Shopping Admin</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="./supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5ff;color:#172554}
header{background:#123b8b;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #0001}
input,select,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccd5e5;border-radius:7px}
textarea{min-height:75px}
button{padding:12px 18px;border:0;border-radius:7px;background:#1769e0;color:white;font-weight:bold;cursor:pointer;margin:3px}
.logout{background:#ffd43b;color:#123b8b}
.danger{background:#dc2626}
.secondary{background:#64748b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.stat{background:white;padding:20px;border-radius:12px;border-left:5px solid #ffd43b}
.stat h2{color:#1769e0}
#dashboard{display:none}
#error{color:red}
#message,#productMessage{color:green}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
th{background:#e7efff}
.product-img{width:55px;height:55px;object-fit:cover;border-radius:7px}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<header>
<h2>AMI SHOPPING</h2>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
</header><div class="container">
<div class="card" id="loginBox">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Admin Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="error"></p>
</div><div id="dashboard">
<h2>Admin Dashboard</h2><div class="stats">
<div class="stat"><p>Total Orders</p><h2 id="totalOrders">0</h2></div>
<div class="stat"><p>Pending Orders</p><h2 id="pendingOrders">0</h2></div>
<div class="stat"><p>Delivered Orders</p><h2 id="deliveredOrders">0</h2></div>
<div class="stat"><p>Total Sales</p><h2 id="totalSales">Rs. 0.00</h2></div>
</div><div class="card">
<h3>Product Management</h3>
<input type="hidden" id="productId"><label>Product Name</label>
<input id="productName" placeholder="Product Name">

<label>Category</label>
<input id="productCategory" placeholder="Category">

<label>Price (LKR)</label>
<input id="productPrice" type="number" min="0" step="0.01" placeholder="Price">

<label>Stock Quantity</label>
<input id="productStock" type="number" min="0" step="1" placeholder="Stock">

<label>Product Image URL</label>
<input id="productImage" type="url" placeholder="https://example.com/image.jpg">

<label>Description</label>

<textarea id="productDescription" placeholder="Product description"></textarea><label>Status</label>
<select id="productActive">

<option value="true">Active</option>
<option value="false">Inactive</option>
</select><button id="saveProductBtn">Add Product</button>
<button id="cancelEditBtn" class="secondary" style="display:none">Cancel Edit</button>

<p id="productMessage"></p>
</div><div class="card">
<h3>Products List</h3>
<button id="refreshProductsBtn">Refresh Products</button>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Image</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="productsList"></tbody>
</table>
</div>
</div><div class="card">
<h3>Customer Orders</h3>
<button id="refreshBtn">Refresh Orders</button>
<p id="message"></p>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Customer</th>
<th>Phone</th>
<th>Address</th>
<th>Items</th>
<th>Total</th>
<th>Status</th>
<th>Update</th>
</tr>
</thead>
<tbody id="ordersList"></tbody>
</table>
</div>
</div>
</div>
</div><script>
const $ = id => document.getElementById(id);

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function db(){
 if(typeof supabaseClient==="undefined"){
  throw new Error("Supabase connection not found.");
 }
 return supabaseClient;
}

async function verifyAdmin(user){
 const {data,error}=await db()
 .from("admin_users")
 .select("user_id")
 .eq("user_id",user.id)
 .maybeSingle();

 if(error) throw error;
 if(!data) throw new Error("You are not authorized as Admin.");
}

async function login(){
 $("error").textContent="";
 $("loginBtn").disabled=true;
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email || !password) throw new Error("Enter email and password.");

  const {data,error}=await db().auth.signInWithPassword({email,password});
  if(error) throw error;

  await verifyAdmin(data.user);
  showDashboard();
 }catch(e){
  $("error").textContent=e.message;
  if(typeof supabaseClient!=="undefined") await db().auth.signOut();
 }finally{
  $("loginBtn").disabled=false;
 }
}

function showDashboard(){
 $("loginBox").style.display="none";
 $("dashboard").style.display="block";
 $("logoutBtn").style.display="block";
 loadOrders();
 loadProducts();
}

/* PRODUCTS */

function resetProductForm(){
 $("productId").value="";
 $("productName").value="";
 $("productCategory").value="";
 $("productPrice").value="";
 $("productStock").value="";
 $("productImage").value="";
 $("productDescription").value="";
 $("productActive").value="true";
 $("saveProductBtn").textContent="Add Product";
 $("cancelEditBtn").style.display="none";
}

async function loadProducts(){
 $("productMessage").textContent="Loading products...";
 try{
  const {data,error}=await db()
   .from("products")
   .select("*")
   .order("created_at",{ascending:false});

  if(error) throw error;

  $("productsList").innerHTML=(data||[]).map(p=>`
   <tr>
    <td>${p.image_url ? `<img class="product-img" src="${escapeHTML(p.image_url)}" alt="">` : "No Image"}</td>
    <td>${escapeHTML(p.name)}</td>
    <td>${escapeHTML(p.category)}</td>
    <td>Rs. ${Number(p.price||0).toFixed(2)}</td>
    <td>${Number(p.stock||0)}</td>
    <td>${p.active ? "Active":"Inactive"}</td>
    <td>
     <button onclick="editProduct('${escapeHTML(p.id)}')">Edit</button>
     <button class="danger" onclick="deleteProduct('${escapeHTML(p.id)}')">Delete</button>
    </td>
   </tr>
  `).join("");

  if(!data?.length){
   $("productsList").innerHTML='<tr><td colspan="7">No products found.</td></tr>';
  }
  $("productMessage").textContent="Products loaded successfully.";
 }catch(e){
  $("productMessage").textContent="Error: "+e.message;
 }
}

async function saveProduct(){
 $("productMessage").textContent="";
 try{
  const name=$("productName").value.trim();
  const category=$("productCategory").value.trim();
  const price=Number($("productPrice").value);
  const stock=Number($("productStock").value);
  const image_url=$("productImage").value.trim();
  const description=$("productDescription").value.trim();
  const active=$("productActive").value==="true";
  const id=$("productId").value;

  if(!name) throw new Error("Enter product name.");
  if($("productPrice").value==="" || !Number.isFinite(price) || price<0)
   throw new Error("Enter a valid product price.");
  if($("productStock").value==="" || !Number.isInteger(stock) || stock<0)
   throw new Error("Enter a valid stock quantity.");

  const product={name,category,price,stock,image_url,description,active};

  let result;
  if(id){
   result=await db().from("products").update(product).eq("id",id);
  }else{
   result=await db().from("products").insert(product);
  }

  if(result.error) throw result.error;

  $("productMessage").textContent=id ? "Product updated successfully!" : "Product added successfully!";
  resetProductForm();
  await loadProducts();
 }catch(e){
  $("productMessage").textContent="Error: "+e.message;
 }
}

async function editProduct(id){
 try{
  const {data,error}=await db()
   .from("products")
   .select("*")
   .eq("id",id)
   .single();

  if(error) throw error;

  $("productId").value=data.id;
  $("productName").value=data.name||"";
  $("productCategory").value=data.category||"";
  $("productPrice").value=data.price??0;
  $("productStock").value=data.stock??0;
  $("productImage").value=data.image_url||"";
  $("productDescription").value=data.description||"";
  $("productActive").value=String(data.active);
  $("saveProductBtn").textContent="Update Product";
  $("cancelEditBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
 }catch(e){
  $("productMessage").textContent="Edit error: "+e.message;
 }
}

async function deleteProduct(id){
 if(!confirm("Are you sure you want to delete this product?")) return;
 try{
  const {error}=await db().from("products").delete().eq("id",id);
  if(error) throw error;
  $("productMessage").textContent="Product deleted successfully.";
  await loadProducts();
 }catch(e){
  $("productMessage").textContent="Delete error: "+e.message;
 }
}

/* ORDERS */

async function loadOrders(){
 $("message").textContent="Loading orders...";
 try{
  const {data,error}=await db()
   .from("orders")
   .select("*")
   .order("created_at",{ascending:false});

  if(error) throw error;

  const orders=data||[];
  $("totalOrders").textContent=orders.length;
  $("pendingOrders").textContent=orders.filter(o=>o.order_status==="pending").length;
  $("deliveredOrders").textContent=orders.filter(o=>o.order_status==="delivered").length;

  const sales=orders.reduce((sum,o)=>sum+(Number(o.total_amount)||0),0);
  $("totalSales").textContent="Rs. "+sales.toLocaleString("en-LK",{minimumFractionDigits:2});

  $("ordersList").innerHTML=orders.map(o=>`
   <tr>
    <td>${escapeHTML(o.customer_name)}</td>
    <td>${escapeHTML(o.customer_phone)}</td>
    <td>${escapeHTML(o.delivery_address)}</td>
    <td>${escapeHTML(typeof o.items==="string"?o.items:JSON.stringify(o.items))}</td>
    <td>Rs. ${Number(o.total_amount||0).toFixed(2)}</td>
    <td>${escapeHTML(o.order_status)}</td>
    <td>
     <select id="status-${escapeHTML(o.id)}">
      <option value="pending" ${o.order_status==="pending"?"selected":""}>Pending</option>
      <option value="processing" ${o.order_status==="processing"?"selected":""}>Processing</option>
      <option value="shipped" ${o.order_status==="shipped"?"selected":""}>Shipped</option>
      <option value="delivered" ${o.order_status==="delivered"?"selected":""}>Delivered</option>
      <option value="cancelled" ${o.order_status==="cancelled"?"selected":""}>Cancelled</option>
     </select>
     <button onclick="updateStatus('${escapeHTML(o.id)}')">Save</button>
    </td>
   </tr>
  `).join("");

  if(!orders.length) $("ordersList").innerHTML='<tr><td colspan="7">No orders found.</td></tr>';
  $("message").textContent="Orders loaded successfully.";
 }catch(e){
  $("message").textContent="Error: "+e.message;
 }
}

async function updateStatus(id){
 try{
  const status=$("status-"+id).value;
  const {error}=await db().from("orders").update({order_status:status}).eq("id",id);
  if(error) throw error;
  $("message").textContent="Order status updated!";
  await loadOrders();
 }catch(e){
  $("message").textContent="Update failed: "+e.message;
 }
}

async function logout(){
 await db().auth.signOut();
 $("dashboard").style.display="none";
 $("loginBox").style.display="block";
 $("logoutBtn").style.display="none";
 $("email").value="";
 $("password").value="";
 resetProductForm();
}

$("loginBtn").addEventListener("click",login);
$("refreshBtn").addEventListener("click",loadOrders);
$("logoutBtn").addEventListener("click",logout);
$("saveProductBtn").addEventListener("click",saveProduct);
$("cancelEditBtn").addEventListener("click",resetProductForm);
$("refreshProductsBtn").addEventListener("click",loadProducts);

(async()=>{
 try{
  const {data}=await db().auth.getSession();
  if(data.session){
   await verifyAdmin(data.session.user);
   showDashboard();
  }
 }catch(e){
  await db().auth.signOut();
 }
})();
</script></body>
</html>
